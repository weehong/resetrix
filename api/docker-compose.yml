# Production-oriented Compose stack. Inject secrets via the host environment
# (or an env_file); do not commit real passwords. Example:
#   export POSTGRES_PASSWORD=...
#   export DATABASE_URL=postgresql://postgres:...@db:5432/resetrix?schema=public
#   export AUTH0_JWKS_URI=... AUTH0_ISSUER=... AUTH0_AUDIENCE=...
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: ${POSTGRES_DB:-resetrix}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot job: apply pending Prisma migrations before the API starts. Built
  # from the `builder` stage because the Prisma CLI and schema are absent from
  # the slim production runtime image.
  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the environment}

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in the environment}
      AUTH0_JWKS_URI: ${AUTH0_JWKS_URI:?Set AUTH0_JWKS_URI in the environment}
      AUTH0_ISSUER: ${AUTH0_ISSUER:?Set AUTH0_ISSUER in the environment}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?Set AUTH0_AUDIENCE in the environment}
      AUTH0_ROLES_NAMESPACE: ${AUTH0_ROLES_NAMESPACE:-https://api.resetrix.com}
    ports:
      - "3000:3000"

volumes:
  postgres-data:
